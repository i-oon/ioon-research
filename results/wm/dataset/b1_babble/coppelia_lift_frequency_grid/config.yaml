experiment: b1_coppelia_lift_frequency_grid
status: precommitted_before_collection
purpose: verify front/rear swing clearance while separating cadence, thigh amplitude, and calf lift
physics:
  engine: Bullet
  scene: sim/env/b1_flat_convex.ttt
  steps: 160
  warmup_steps: 25
grid:
  frequency_hz: [1.5, 1.75, 2.0]
  thigh_amplitude: [0.14, 0.18, 0.22]
  calf_to_thigh_ratio: [2.0, 2.5]
  seed: 0
fixed:
  hip_to_thigh_ratio: 0.1
  diagonal_pairs: [[FL, RR], [FR, RL]]
  calf_shape: positive_half_wave_during_swing_only
  startup_ramp_seconds: 1.0
  gaussian_noise_std_all_motors: 0.05
measurements:
  foot_order: [FL, FR, RL, RR]
  record_world_foot_positions: true
selection:
  retain_every_attempt: true
  filter_falls: false
  filter_by_froude: false
rendering:
  view: egocentric
claim: controlled engineering pilot for a generic quadruped stance-swing CPG; not training data
